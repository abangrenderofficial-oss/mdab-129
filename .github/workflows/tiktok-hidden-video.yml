name: MediaX TikTok Hidden Video

on:
  workflow_dispatch:
    inputs:
      chat_id:
        description: Telegram recipient chat ID
        type: string
        required: true
      source_url:
        description: Public TikTok source URL
        type: string
        required: true
      reply_markup:
        description: Telegram reply_markup JSON (MediaX buttons)
        type: string
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: mediax-tiktok-hidden-${{ inputs.chat_id }}
  cancel-in-progress: false

jobs:
  deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      HIDDEN_CHAT_ID: ${{ inputs.chat_id }}
      HIDDEN_SOURCE_URL: ${{ inputs.source_url }}
      HIDDEN_REPLY_MARKUP: ${{ inputs.reply_markup }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Ensure FFmpeg
        run: |
          if ! command -v ffprobe >/dev/null 2>&1; then sudo apt-get update -qq && sudo apt-get install -y ffmpeg; fi
      - name: Install requests
        run: python -m pip install --disable-pip-version-check --quiet requests
      - name: Deliver hidden TikTok video
        run: python scripts/tiktok_hidden_video_worker.py
