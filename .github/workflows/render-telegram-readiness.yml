name: MediaX Render worker Telegram credential probe
on:
  push:
    branches:
      - infra/mediax-render-standby
    paths:
      - 'scripts/render-hq-telegram-readiness.mjs'
      - 'scripts/render_hq_mtproto_readiness.py'
      - '.github/workflows/render-telegram-readiness.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  read-only-worker-bot-auth:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
      TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify GitHub worker bot identity and existing webhook (read only)
        run: node scripts/render-hq-telegram-readiness.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify MTProto worker session without updates (read only)
        run: |
          python -m pip install --disable-pip-version-check --quiet 'kurigram[fast]==2.2.26'
          python scripts/render_hq_mtproto_readiness.py
