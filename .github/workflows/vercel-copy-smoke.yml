name: Vercel Copy Smoke

on:
  pull_request:
    branches: [main]

jobs:
  smoke:
    if: ${{ github.head_ref == 'migration/vercel-runtime' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PREVIEW_BASE: https://mdab-129-git-migration-272d5f-abangrenderofficial-oss-projects.vercel.app
    steps:
      - name: Wait for Vercel preview
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 24); do
            code="$(curl -L -sS -o /tmp/health.json -w '%{http_code}' "$PREVIEW_BASE/api/health" || true)"
            echo "attempt=$i http=$code"
            if [ "$code" = "200" ]; then
              cat /tmp/health.json
              exit 0
            fi
            sleep 5
          done
          echo "Preview health endpoint did not become reachable"
          cat /tmp/health.json 2>/dev/null || true
          exit 1

      - name: Verify root router
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail-with-body --silent --show-error "$PREVIEW_BASE/"

      - name: Summarize runtime config
        shell: bash
        run: |
          python - <<'PY'
          import json
          data = json.load(open('/tmp/health.json'))
          print('runtime=', data.get('runtime'))
          print('heavyMediaRuntime=', data.get('heavyMediaRuntime'))
          print('databaseRuntime=', data.get('databaseRuntime'))
          print('missingRuntimeEnv=', data.get('missingRuntimeEnv'))
          PY
