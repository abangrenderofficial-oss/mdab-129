name: status-variant-test

on:
  workflow_dispatch:
    inputs:
      chat_id:
        required: true
        type: string
      video_file_id:
        required: true
        type: string
      source_message_id:
        required: false
        default: '0'
        type: string

permissions:
  contents: read

jobs:
  variants:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
      TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      HEAVY_CHAT_ID: ${{ inputs.chat_id }}
      HEAVY_VIDEO_FILE_ID: ${{ inputs.video_file_id }}
      HEAVY_SOURCE_MESSAGE_ID: ${{ inputs.source_message_id }}
      HEAVY_SOURCE_KIND: gallery
      HEAVY_VIDEO_MAX_MB: '500'
      PYTHONPATH: scripts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Ensure FFmpeg
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then sudo apt-get update -qq && sudo apt-get install -y ffmpeg; fi
      - name: Install MTProto client
        run: python -m pip install --disable-pip-version-check --quiet 'kurigram[fast]==2.2.26' requests
      - name: Encode and send variants
        run: python scripts/status_variant_test.py
