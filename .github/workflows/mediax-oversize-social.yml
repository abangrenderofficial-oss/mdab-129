name: MediaX Oversize TikTok Delivery

on:
  workflow_dispatch:
    inputs:
      chat_id:
        description: Telegram recipient chat ID
        type: string
        required: true
      source_url:
        description: Public TikTok source URL
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: mediax-oversize-${{ inputs.chat_id }}
  cancel-in-progress: false

jobs:
  deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      SOCIAL_CHAT_ID: ${{ inputs.chat_id }}
      SOCIAL_SOURCE_URL: ${{ inputs.source_url }}

    steps:
      - name: Check out MediaX
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Confirm FFmpeg and Node
        shell: bash
        run: |
          if ! command -v ffmpeg || ! command -v ffprobe; then
            sudo apt-get update -qq
            sudo apt-get install -y ffmpeg
          fi
          ffmpeg -version | head -n 1
          node --version

      - name: Install TikTok extractor
        run: python -m pip install --disable-pip-version-check --quiet yt-dlp requests

      - name: Deliver oversized TikTok video
        run: python scripts/mediax_oversize_social_worker.py
